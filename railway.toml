[build]
builder = "nixpacks"
buildCommand = "npm install && npx prisma generate"

[deploy]
startCommand = "export DATABASE_URL=${DATABASE_URL:-${POSTGRES_URL:-${DATABASE_PRIVATE_URL}}}; npx prisma db push --accept-data-loss && node server.js"
healthcheckPath = "/health/live"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
