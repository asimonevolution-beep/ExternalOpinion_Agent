<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento annullato — External Opinion</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{background:#F5F0E8;color:#1A1612;font-family:sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
  .card{background:#fff;border:1px solid rgba(26,22,18,.12);max-width:520px;width:100%;padding:3rem;text-align:center}
  .icon{font-size:3rem;margin-bottom:1.5rem}
  h1{font-family:'Cormorant Garamond',serif;font-size:2.2rem;font-weight:300;margin-bottom:1rem}
  p{font-size:.95rem;line-height:1.7;color:#5A5249;margin-bottom:1rem}
  .btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-top:1.5rem}
  .btn{padding:.9rem 1.8rem;text-decoration:none;font-size:.85rem;font-weight:500;border-radius:2px}
  .primary{background:#1A1612;color:#F5F0E8}.primary:hover{background:#C8A96E}
  .secondary{border:1px solid rgba(26,22,18,.3);color:#1A1612}.secondary:hover{background:#f0ece4}
  .note{font-size:.78rem;color:#8C8279;margin-top:1.5rem}
</style>
</head>
<body>
<div class="card">
  <div class="icon">&#8592;</div>
  <h1>Pagamento annullato</h1>
  <p>Nessun addebito e stato effettuato.<br>La tua analisi e ancora disponibile quando vuoi procedere.</p>
  <div class="btns">
    <a href="/" class="btn primary">Riprova</a>
    <a href="mailto:info@externalopinion.it" class="btn secondary">Contattaci</a>
  </div>
  <p class="note">L analisi rimane salvata per 24h. Puoi riprendere dal punto in cui ti sei fermato.</p>
</div>
</body>
</html>
