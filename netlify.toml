[build]
  publish = "public"

# Proxy tutte le chiamate /api/* verso il backend Railway
[[redirects]]
  from   = "/api/*"
  to     = "https://externalopinionagent-production-1f66.up.railway.app/api/:splat"
  status = 200
  force  = true

# Proxy /aste/* verso Railway (checkout aste giudiziarie)
[[redirects]]
  from   = "/aste/*"
  to     = "https://externalopinionagent-production-1f66.up.railway.app/aste/:splat"
  status = 200
  force  = true

# SPA fallback
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
